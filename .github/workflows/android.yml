# App Android di Forfy "nativa" (guscio Capacitor): apre l'app in una finestra sua, senza Chrome,
# quindi niente barra dell'indirizzo e notifiche a nome dell'app. Sostituisce la vecchia TWA fatta con PWABuilder.
# Il sito è incluso nell'app (funziona offline): si ricompila a ogni modifica del sito o di app/ (o a mano da Actions → Run workflow):
#  1. compila l'AAB con numero di versione automatico (100 + numero della build, più alto della vecchia TWA)
#  2. lo firma con la stessa chiave della TWA (stessi segreti): per Play è un normale aggiornamento
#  3. lo carica come BOZZA nel test "internal" (non va online finché non premi "Avvia implementazione")
# Segreti: TWA_KEYSTORE_B64, TWA_KEYSTORE_PASSWORD, TWA_KEY_ALIAS, TWA_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON
name: Android Forfy (nativa)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml', 'index.html', 'assets/**', 'icons/**', 'privacy.html', 'manifest.webmanifest']
concurrency:
  group: android-native
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Numero di versione
        run: echo "VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
      - name: Dipendenze e sync Capacitor
        working-directory: app
        run: npm ci && node copy-www.mjs && npx cap sync android
      - name: Build AAB
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - name: Firma (solo se ci sono i segreti)
        id: sign
        env:
          KS_B64: ${{ secrets.TWA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TWA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.TWA_KEY_PASSWORD }}
        run: |
          mkdir -p out && cp app/android/app/build/outputs/bundle/release/*.aab "out/Forfy-$VERSION_CODE-unsigned.aab"
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "Chiave non impostata: AAB non firmato"; echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          cp "out/Forfy-$VERSION_CODE-unsigned.aab" "out/Forfy-$VERSION_CODE.aab"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/upload.keystore" \
            -storepass "$KS_PASS" -keypass "${KEY_PASS:-$KS_PASS}" "out/Forfy-$VERSION_CODE.aab" "${KEY_ALIAS:-upload}"
          rm -f "$RUNNER_TEMP/upload.keystore" "out/Forfy-$VERSION_CODE-unsigned.aab"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: Forfy-aab, path: out/*.aab }
      - name: Play configurato?
        id: playcheck
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA" ] && [ "${{ steps.sign.outputs.signed }}" = "true" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "Caricamento su Play saltato"; fi
      - name: Carica su Play (bozza)
        if: steps.playcheck.outputs.go == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: it.controllinghub.forfy
          releaseFiles: out/Forfy-${{ env.VERSION_CODE }}.aab
          track: internal
          status: draft
