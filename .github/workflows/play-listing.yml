name: Play Store - nome app

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Nome dell'app nella scheda dello store"
        required: true
        default: "Forfettix"

jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth
      - name: Aggiorna il nome in tutte le lingue della scheda
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TITLE: ${{ inputs.title }}
          PKG: it.controllinghub.forfy
        run: |
          python - <<'EOF'
          import json, os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError
          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["SA"]), scopes=["https://www.googleapis.com/auth/androidpublisher"])
          ap = build("androidpublisher", "v3", credentials=creds, cache_discovery=False)
          pkg, title = os.environ["PKG"], os.environ["TITLE"]
          edit = ap.edits().insert(packageName=pkg, body={}).execute()["id"]
          listings = ap.edits().listings().list(packageName=pkg, editId=edit).execute().get("listings", [])
          for l in listings:
              print(f"{l['language']}: '{l.get('title')}' -> '{title}'")
              ap.edits().listings().patch(packageName=pkg, editId=edit, language=l["language"], body={"title": title}).execute()
          try:
              ap.edits().commit(packageName=pkg, editId=edit).execute()
          except HttpError as e:
              if "changesNotSentForReview" not in str(e): raise
              ap.edits().commit(packageName=pkg, editId=edit, changesNotSentForReview=True).execute()
              print("Modifiche salvate ma non inviate in revisione: inviale da Play Console > Panoramica pubblicazione.")
          print("Fatto.")
          EOF
